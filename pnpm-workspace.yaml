# Dependency install scripts are denied unless a reason is recorded here.
allowBuilds:
  # Optional native image optimiser; no images are optimised yet (revisit with next/image).
  sharp: false
  # Optional native resolver speed-up for eslint-plugin-import; not needed.
  unrs-resolver: false
  # Pulled in by drizzle-kit and Vitest. The platform binary ships as an optional dependency,
  # so the install script is not needed.
  esbuild: false
  # Optional native file watcher for the sass CLI; Next compiles Sass itself.
  '@parcel/watcher': false

overrides:
  # drizzle-kit pulls esbuild 0.18 through the deprecated @esbuild-kit loader; versions up to
  # 0.24.2 let any website send requests to the dev server (GHSA-67mh-4wv8-2f99). Dev-only.
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
